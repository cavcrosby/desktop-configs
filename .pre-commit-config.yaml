---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: trailing-whitespace

  - repo: https://github.com/cavcrosby/shellcheck-precommit.git
    rev: v0.13.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/pre-commit/mirrors-eslint.git
    rev: v10.10.0
    hooks:
    -   id: eslint

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write
        language: node
        types:
          - javascript
        additional_dependencies:
          - prettier@3.9.6

  - repo: https://github.com/betterleaks/betterleaks.git
    rev: v1.8.1
    hooks:
      - id: betterleaks

  - repo: https://github.com/tombi-toml/tombi-pre-commit.git
    rev: v1.5.5
    hooks:
      - id: tombi-lint
      - id: tombi-format
